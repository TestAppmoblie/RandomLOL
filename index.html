<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บสุ่มห้ำหั่นสุดโหด</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif, Tahoma;
    }

    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      border: 4px solid #1a82e2;
      width: 100%;
      max-width: 800px;
      padding: 30px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: normal;
      color: #111;
      margin-bottom: 20px;
      text-align: center;
    }

    .add-player-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 15px;
    }

    .add-player-box input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .add-player-box input:focus {
      border-color: #1a82e2;
    }

    .btn-add {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: #218838;
    }

    .board {
      background-color: #d9d9d9;
      width: 100%;
      max-width: 700px;
      min-height: 320px;
      padding: 25px 20px;
      margin-bottom: 25px;
    }

    /* Grid layout for selection page */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px 12px;
    }

    .player-card {
      background-color: #be4343;
      color: white;
      border-radius: 25px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background-color 0.2s;
    }

    .player-card:hover {
      transform: translateY(-2px);
    }

    .player-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .checkbox-custom {
      width: 16px;
      height: 16px;
      background-color: #e0e0e0;
      border: 1px solid #777;
      margin-right: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox-custom.checked::after {
      content: '✓';
      color: #be4343;
      font-weight: bold;
      font-size: 12px;
    }

    .player-name {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: center;
    }

    .btn-delete {
      color: #ffcccc;
      font-size: 12px;
      cursor: pointer;
      padding: 0 4px;
      margin-left: 4px;
    }

    .btn-delete:hover {
      color: #ffffff;
      font-weight: bold;
    }

    /* Split Team Layout */
    .team-split {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .team-column {
      width: 45%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-title {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #222;
    }

    .team-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      align-items: center;
    }

    .team-card {
      background-color: #be4343;
      color: white;
      border-radius: 25px;
      padding: 10px 15px;
      width: 100%;
      max-width: 180px;
      text-align: center;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 20px;
    }

    .btn-action {
      background-color: #d9d9d9;
      color: #111;
      border: none;
      border-radius: 20px;
      padding: 10px 25px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background-color: #c5c5c5;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 650px) {
      .player-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>เว็บสุ่มห้ำหั่นสุดโหด</h1>

    <!-- หน้าที่ 1: หน้าเลือกผู้เล่น -->
    <div id="page-selection" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      
      <!-- ช่องเพิ่มผู้เล่น -->
      <div class="add-player-box">
        <input type="text" id="new-player-input" placeholder="พิมพ์ชื่อผู้เล่นใหม่..." onkeypress="handleKeyPress(event)">
        <button class="btn-add" onclick="addPlayer()">+ เพิ่มคน</button>
      </div>

      <div class="board">
        <div class="player-grid" id="player-grid"></div>
      </div>
      <button class="btn-action" onclick="startRandom()">สุ่มเลยอิอิ</button>
    </div>

    <!-- หน้าที่ 2: หน้าแสดงผลการสุ่มทีม -->
    <div id="page-result" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="board">
        <div class="team-split">
          <div class="team-column">
            <div class="team-title">ซ้าย</div>
            <div class="team-list" id="team-left"></div>
          </div>
          <div class="team-column">
            <div class="team-title">ขวา</div>
            <div class="team-list" id="team-right"></div>
          </div>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn-action" onclick="goBackToSelection()">สุ่มใหม่เลย</button>
        <button class="btn-action" onclick="reshuffleAll()">สุ่มใหม่หมด</button>
      </div>
    </div>
  </div>

  <script>
    // รายชื่อผู้เล่นเริ่มต้น
    const defaultPlayers = [
      "Kobe", "เกษตรกรมอง HEE", "Cosmic", "degujeff",
      "FllUKsY1", "I miss hee", "ผมชอบเกาเหลา", "มดแดงทรงนง",
      "สงครามปากกาชาด", "หมากกระจาย", "เทพเจเทรปาโซเบโซ", "เมกะมายเมโทโชตEE",
      "แทงแมงมอม", "르블랑", "โชบอสซไล เบอร์แปด", "David Beckham"
    ];

    let players = [];

    // โหลดข้อมูลจาก LocalStorage
    function loadPlayers() {
      const saved = localStorage.getItem('custom_players_data');
      if (saved) {
        players = JSON.parse(saved);
      } else {
        players = defaultPlayers.map(name => ({ name, selected: false }));
        savePlayers();
      }
    }

    // เซฟข้อมูลลง LocalStorage
    function savePlayers() {
      localStorage.setItem('custom_players_data', JSON.stringify(players));
    }

    function renderPlayers() {
      const grid = document.getElementById('player-grid');
      grid.innerHTML = '';

      const selectedCount = players.filter(p => p.selected).length;

      players.forEach((player, index) => {
        const card = document.createElement('div');
        card.className = 'player-card';
        
        if (!player.selected && selectedCount >= 10) {
          card.classList.add('disabled');
        }

        const checkBtn = document.createElement('div');
        checkBtn.className = `checkbox-custom ${player.selected ? 'checked' : ''}`;

        const nameSpan = document.createElement('span');
        nameSpan.className = 'player-name';
        nameSpan.innerText = player.name;

        const delBtn = document.createElement('span');
        delBtn.className = 'btn-delete';
        delBtn.innerText = '✕';
        delBtn.title = 'ลบชื่อนี้';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deletePlayer(index);
        };

        card.onclick = () => toggleSelect(index);

        card.appendChild(checkBtn);
        card.appendChild(nameSpan);
        card.appendChild(delBtn);
        grid.appendChild(card);
      });
    }

    function toggleSelect(index) {
      const selectedCount = players.filter(p => p.selected).length;
      if (!players[index].selected && selectedCount >= 10) {
        alert("เลือกได้สูงสุดแค่ 10 คนเท่านั้นครับ!");
        return;
      }
      players[index].selected = !players[index].selected;
      savePlayers();
      renderPlayers();
    }

    function addPlayer() {
      const input = document.getElementById('new-player-input');
      const name = input.value.trim();
      if (!name) return;

      players.push({ name: name, selected: false });
      savePlayers();
      renderPlayers();
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        addPlayer();
      }
    }

    function deletePlayer(index) {
      players.splice(index, 1);
      savePlayers();
      renderPlayers();
    }

    function startRandom() {
      const selectedPlayers = players.filter(p => p.selected);
      if (selectedPlayers.length !== 10) {
        alert(`ต้องเลือกผู้เล่นให้ครบ 10 คนก่อนครับ! (ตอนนี้เลือกไว้ ${selectedPlayers.length} คน)`);
        return;
      }
      shuffleAndDisplay(selectedPlayers.map(p => p.name));
      document.getElementById('page-selection').classList.add('hidden');
      document.getElementById('page-result').classList.remove('hidden');
    }

    function shuffleAndDisplay(playerNames) {
      const shuffled = [...playerNames].sort(() => Math.random() - 0.5);
      const teamLeft = shuffled.slice(0, 5);
      const teamRight = shuffled.slice(5, 10);

      const leftContainer = document.getElementById('team-left');
      const rightContainer = document.getElementById('team-right');

      leftContainer.innerHTML = '';
      rightContainer.innerHTML = '';

      teamLeft.forEach(name => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerText = name;
        leftContainer.appendChild(card);
      });

      teamRight.forEach(name => {
        const card = document.createElement('div');
        card.className = 'team-card';
        card.innerText = name;
        rightContainer.appendChild(card);
      });
    }

    function goBackToSelection() {
      document.getElementById('page-result').classList.add('hidden');
      document.getElementById('page-selection').classList.remove('hidden');
      renderPlayers();
    }

    function reshuffleAll() {
      const selectedPlayers = players.filter(p => p.selected).map(p => p.name);
      shuffleAndDisplay(selectedPlayers);
    }

    // โหลดครั้งแรกเมื่อเปิดหน้าเว็บ
    loadPlayers();
    renderPlayers();
  </script>
</body>
</html>
